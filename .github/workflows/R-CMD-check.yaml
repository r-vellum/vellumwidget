# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# `vellumwidget` builds on `vellum`, whose backend is Rust (extendr). The extra
# `setup-rust-toolchain` step provides the compiler that building `vellum` from
# source (via the `Remotes:` entry in DESCRIPTION) needs; everything else is the
# standard r-lib R-CMD-check flow.
on:
  push:
    branches: [main]
  pull_request:
  # Nightly cross-layer check. vellum and vellumwidget are version-locked and
  # co-released, so a nightly catches a break in vellum's main before it bricks
  # a release. The `Remotes:` entries (r-vellum/vellum, r-vellum/vellumplot)
  # resolve to each repo's default branch, so every run builds against main.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # Trimmed to a single Linux job to conserve Actions minutes. The full
          # matrix (macOS + R devel/release/oldrel-1) lived here — macOS bills at
          # 10x, so it was the dominant cost. Restore before release.
          - {os: ubuntu-latest,  r: 'release'}
          # Windows is deferred: `vellum`'s Rust toolchain needs the GNU target
          # wired to Rtools, which is finicky on CI. Add once that is proven.

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # Rust compiler for building `vellum` (SystemRequirements: Cargo, rustc).
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # X-9: a PR that needs an unmerged vellum or vellumplot branch says so
      # with a line `vellum-ref: <branch, tag or sha>` (or `vellumplot-ref:`)
      # in its description; this step points that `Remotes:` entry at the ref,
      # in this checkout only (nothing is committed). The body is read live,
      # so editing it and re-running the job picks the change up. Without the
      # line, on pushes and nightly, or when the ref no longer exists (the
      # branch was merged and deleted), the build uses the repos' main. See
      # CONTRIBUTING.md.
      - name: Dependency refs from the PR description
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""' | tr -d '\r')
          for pkg in vellum vellumplot; do
            ref=$(printf '%s\n' "$body" | sed -n "s/^[[:space:]]*$pkg-ref:[[:space:]]*\([^[:space:]]*\)[[:space:]]*\$/\1/p" | head -n 1)
            [ -n "$ref" ] || continue
            if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$'; then
              echo "::error::$pkg-ref '$ref' is not a valid git ref name"
              exit 1
            fi
            if ! git ls-remote --exit-code "https://github.com/r-vellum/$pkg" "$ref" > /dev/null &&
               ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "::warning::$pkg-ref '$ref' is not on r-vellum/$pkg (merged and deleted?): building against its main"
              continue
            fi
            sed -i -E "s#r-vellum/$pkg([,[:space:]]|\$)#r-vellum/$pkg@$ref\1#" DESCRIPTION
            echo "::notice::Building against r-vellum/$pkg@$ref (from the PR description)"
          done
          sed -n '/^Remotes:/,/^[^[:space:]]/p' DESCRIPTION

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
